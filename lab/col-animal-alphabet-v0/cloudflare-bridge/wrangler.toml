name = "col-animal-relay-isolated"
main = "worker.mjs"
compatibility_date = "2026-10-19"

[durable_objects]
bindings = [{ name = "COL_RECEIVERS", class_name = "ColReceiver" }]

[[migrations]]
tag = "col-receiver-v1"
new_sqlite_classes = ["ColReceiver"]

# No routes, account IDs, secrets or production triggers in source.
# Owner secret must be supplied securely at deployment, never committed.

[vars]
TABLET_ALLOWED_ORIGIN = "https://col-animal-alphabet-preview.vercel.app"
