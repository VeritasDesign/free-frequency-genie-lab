name: Col Roku Receiver Source Checks
on:
  pull_request:
    paths:
      - 'lab/col-animal-alphabet-v0/roku-companion-v0/**'
      - '.github/workflows/col-roku-receiver-checks.yml'
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node lab/col-animal-alphabet-v0/roku-companion-v0/receiver-static-check.mjs
