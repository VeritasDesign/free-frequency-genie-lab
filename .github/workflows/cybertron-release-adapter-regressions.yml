name: Cybertron release adapter regressions

on:
  pull_request:
    paths:
      - 'lab/release_adapter/**'
      - 'lab/vercel_read_auth/**'
      - '.github/workflows/cybertron-release-adapter-regressions.yml'

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run focused release-adapter regressions
        run: |
          set -euo pipefail
          python3 -m unittest -v lab.release_adapter.test_serverless_readback lab.release_adapter.test_deployment_polling lab.release_adapter.test_project_root_mode lab.vercel_read_auth.test_provider_root_mode
          python3 lab/release_adapter/reconstruct_sentinel_v02_candidate.py \
            --chunks-dir lab/release_adapter/sources/sentinel_v02_candidate_chunks \
            --output "$RUNNER_TEMP/sentinel-v02-source.zip"
          echo '017e86298b32aa56c3d4c327b2db290a8c7561758640d8f9068a31bc7429f956  '"$RUNNER_TEMP/sentinel-v02-source.zip" | sha256sum -c -
          python3 -m zipfile -t "$RUNNER_TEMP/sentinel-v02-source.zip"
