name: Cybertron Airtable Actuator v0.1 tests
on:
  pull_request:
    paths:
      - 'lab/cybertron_airtable_actuator_v01/**'
      - '.github/workflows/cybertron-airtable-actuator-v01-test.yml'
permissions:
  contents: read
jobs:
  deterministic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actuator acceptance suite
        run: node lab/cybertron_airtable_actuator_v01/test.cjs
  live-actuate-003b:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'factory-cybertron-airtable-actuator-v01' }}
    needs: deterministic-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded AIR-ROCK-003B actuator
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node lab/cybertron_airtable_actuator_v01/cybertron-airtable-actuator-v01.cjs
