name: Cybertron Airtable Actuator v0.1 tests
on:
  pull_request:
    paths:
      - 'lab/cybertron_airtable_actuator_v01/**'
      - '.github/workflows/cybertron-airtable-actuator-v01-test.yml'
  workflow_dispatch:
    inputs:
      live_actuate_003b:
        description: 'Run the bounded live AIR-ROCK-003B actuator'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deterministic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actuator acceptance suite
        run: node lab/cybertron_airtable_actuator_v01/test.cjs
  live-actuate-003b:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_actuate_003b == true }}
    needs: deterministic-test
    runs-on: ubuntu-latest
    environment: cybertron-rock
    steps:
      - uses: actions/checkout@v4
      - name: Execute bounded AIR-ROCK-003B actuator
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node lab/cybertron_airtable_actuator_v01/cybertron-airtable-actuator-v01.cjs
