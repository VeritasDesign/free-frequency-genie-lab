name: Cybertron isolated work-order worker
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  pickup:
    if: startsWith(github.event.issue.title, '[CYBERTRON TEST] ')
    runs-on: ubuntu-latest
    concurrency:
      group: cybertron-order-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Claim and execute allowlisted isolated test
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issue_number = context.issue.number;
            const issue = context.payload.issue;
            const marker = '<!-- CYBERTRON-WO-V0.1';
            const end = ' -->';
            const start = issue.body?.indexOf(marker) ?? -1;
            const finish = start >= 0 ? issue.body.indexOf(end, start) : -1;
            if (start < 0 || finish < 0) { core.setFailed('BLOCKED: missing order payload'); return; }
            let order;
            try { order = JSON.parse(issue.body.slice(start + marker.length, finish)); }
            catch (e) { core.setFailed('BLOCKED: invalid JSON payload'); return; }
            const allowed = order.version === '0.1' && order.worker === 'github-actions-isolated' &&
              order.task_type === 'harmless-receipt-test' && order.target === 'free-frequency-genie-lab/dispatch' &&
              order.scope === 'issue-comments-only' && order.production_release === false &&
              order.acceptance === 'worker claims, records receipt, repeat pickup is idempotent';
            const {data: comments} = await github.rest.issues.listComments({owner,repo,issue_number,per_page:100});
            const prefix = 'CYBERTRON_RECEIPT_V0.1 ';
            const prior = comments.find(c => c.body?.startsWith(prefix) && c.body.includes('"id":"' + order.id + '"'));
            if (prior) { core.info('DUPLICATE_PICKUP_SKIPPED receipt=' + prior.html_url); return; }
            const post = async (body) => github.rest.issues.createComment({owner,repo,issue_number,body});
            if (!allowed) {
              await post(prefix + JSON.stringify({id:order.id||'UNKNOWN',status:'BLOCKED',worker:'github-actions-isolated',blocker:'Order is not the exact allowlisted isolated test; no task executed',run:context.runId}));
              core.setFailed('BLOCKED: outside authorized test scope');
              return;
            }
            await post('CYBERTRON_CLAIM_V0.1 ' + JSON.stringify({id:order.id,status:'CLAIMED',worker:'github-actions-isolated',run:context.runId}));
            await post('CYBERTRON_STATUS_V0.1 ' + JSON.stringify({id:order.id,status:'RUNNING',run:context.runId}));
            const receipt = {id:order.id,status:'COMPLETE',worker:'github-actions-isolated',task_type:order.task_type,
              result:'allowlisted runner executed and posted receipt; no project files modified',
              test:'PASS: payload and scope validated; claim and completion posted',
              source_commit:context.sha,run:context.runId,production_release:false};
            const response = await post(prefix + JSON.stringify(receipt));
            core.info('WORKER_COMPLETE receipt=' + response.data.html_url);
