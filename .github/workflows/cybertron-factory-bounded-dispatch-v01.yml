name: Cybertron Factory bounded dispatcher v0.2

on:
  workflow_run:
    workflows: ["Cybertron role router v0.1"]
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted dispatcher source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Match and assign bounded Factory work
        uses: actions/github-script@v7
        env:
          FACTORY_BUILDER_USER_TOKEN: ${{ secrets.FACTORY_BUILDER_USER_TOKEN }}
        with:
          script: |
            const d=require('./.github/scripts/factory-copilot-dispatch-v01.cjs');
            const prefix='CYBERTRON_ROLE_RECEIPT_V0.1 ';
            const runId=context.payload.workflow_run.id;
            const owner=context.repo.owner, repo=context.repo.repo;

            const issues=await github.paginate(github.rest.issues.listForRepo,{
              owner,repo,state:'open',per_page:100
            });
            const matches=[];
            for(const issue of issues){
              if(issue.user?.login!=='VeritasDesign' || !issue.title?.startsWith('FACTORY — ')) continue;
              const comments=await github.paginate(github.rest.issues.listComments,{
                owner,repo,issue_number:issue.number,per_page:100
              });
              for(const c of comments){
                if(c.user?.login!=='github-actions[bot]' || !c.body?.startsWith(prefix)) continue;
                let r=null; try{r=JSON.parse(c.body.slice(prefix.length))}catch{}
                if(!r || r.router_run!==runId) continue;
                matches.push({issue,r,comments});
              }
            }
            if(matches.length!==1){
              core.info('FACTORY_DISPATCH_SKIP routed order not uniquely found');
              return;
            }

            const {issue,r,comments}=matches[0];
            if(!d.validReceipt(r,issue)){
              core.info('FACTORY_DISPATCH_UNSUPPORTED_OR_UNSAFE '+String(r?.task_class||'unknown'));
              return;
            }
            if(d.hasTerminalExecution(comments,r.id)){
              core.info('FACTORY_DISPATCH_TERMINAL_SKIP '+r.id);
              return;
            }
            if(d.hasBuilderAssignment(comments,r.id)){
              core.info('FACTORY_DISPATCH_DUPLICATE_ASSIGNMENT_SKIP '+r.id);
              return;
            }

            const cap=d.CAPABILITIES[r.task_class];
            if(cap.prerequisiteIssue){
              const priorComments=await github.paginate(github.rest.issues.listComments,{
                owner,repo,issue_number:cap.prerequisiteIssue,per_page:100
              });
              if(!d.acceptedPrerequisite(priorComments,cap.prerequisiteIssue)){
                const alreadyWaiting=comments.some(c=>c.body?.startsWith('FACTORY_BUILDER_WAIT_V0.1 ') && c.body?.includes('"id":"'+r.id+'"'));
                if(!alreadyWaiting){
                  await github.rest.issues.createComment({
                    owner,repo,issue_number:issue.number,
                    body:'FACTORY_BUILDER_WAIT_V0.1 '+JSON.stringify({
                      version:'0.1',id:r.id,status:'WAITING',task_class:r.task_class,
                      prerequisite_issue:cap.prerequisiteIssue,
                      production_write:false,deploy:false,
                      execution_authority:'NONE',
                      note:'Builder assignment is fail-closed until the prior Factory result is explicitly ACCEPTED.'
                    })
                  });
                }
                core.info('FACTORY_DISPATCH_WAITING '+r.id+' prerequisite #'+cap.prerequisiteIssue);
                return;
              }
            }

            const builderToken=process.env.FACTORY_BUILDER_USER_TOKEN;
            if(r.task_class==='hq-v08-recovery-bootstrap'){
              if(!builderToken){
                await github.rest.issues.createComment({
                  owner,repo,issue_number:issue.number,
                  body:'FACTORY_BUILDER_ASSIGNMENT_V0.1 '+JSON.stringify({
                    version:'0.1',id:r.id,status:'BLOCKED',task_class:r.task_class,
                    builder:'factory-free-deterministic-builder-v0.1',target_repo:cap.targetRepo,base_branch:cap.baseBranch,
                    blocker:'missing_FACTORY_BUILDER_USER_TOKEN',production_write:false,deploy:false,execution_authority:'NONE'
                  })
                });
                core.setFailed('Missing FACTORY_BUILDER_USER_TOKEN');
                return;
              }
              try{
                await github.request('POST /repos/{owner}/{repo}/issues',{
                  owner:'VeritasDesign',repo:'free-frequency-factory',
                  title:'FACTORY HQ FREE DISPATCH — AIR-HQ-001',
                  body:'Exact free deterministic Factory dispatch for AIR-HQ-001. Source: VeritasDesign/free-frequency-genie-lab#147. Target branch: hq-v08-recovery-bootstrap-2026-10-07. Authority: BRANCH_PR_ONLY. No merge. No deploy.',
                  headers:{accept:'application/vnd.github+json',authorization:'Bearer '+builderToken,'X-GitHub-Api-Version':'2022-11-28'}
                });
              }catch(err){
                const status=err?.status||err?.response?.status||'unknown';
                await github.rest.issues.createComment({
                  owner,repo,issue_number:issue.number,
                  body:'FACTORY_BUILDER_ASSIGNMENT_V0.1 '+JSON.stringify({
                    version:'0.1',id:r.id,status:'BLOCKED',task_class:r.task_class,
                    builder:'factory-free-deterministic-builder-v0.1',target_repo:cap.targetRepo,base_branch:cap.baseBranch,
                    blocker:'free_builder_issue_dispatch_failed_http_'+status,production_write:false,deploy:false,execution_authority:'NONE'
                  })
                });
                core.setFailed('Free deterministic HQ Builder dispatch failed HTTP '+status);
                return;
              }
              await github.rest.issues.createComment({
                owner,repo,issue_number:issue.number,
                body:d.ASSIGN_PREFIX+JSON.stringify({
                  version:'0.1',id:r.id,status:'ASSIGNED',task_class:r.task_class,
                  work_order:'AIR-HQ-001',builder:'factory-free-deterministic-builder-v0.1',
                  target_repo:cap.targetRepo,base_branch:cap.baseBranch,router_run:runId,
                  production_write:false,deploy:false,execution_authority:'BRANCH_PR_ONLY',
                  next_gate:'Free deterministic Builder opens HQ recovery PR; Chief verifies evidence; no merge or deploy.'
                })
              });
              core.info('FACTORY_FREE_BUILDER_DISPATCHED '+r.id+' -> AIR-HQ-001');
              return;
            }

            const payload=d.assignmentPayload(r);
            if(!builderToken){
              await github.rest.issues.createComment({
                owner,repo,issue_number:issue.number,
                body:'FACTORY_BUILDER_ASSIGNMENT_V0.1 '+JSON.stringify({
                  version:'0.1',id:r.id,status:'BLOCKED',task_class:r.task_class,
                  builder:d.BUILDER,target_repo:cap.targetRepo,base_branch:cap.baseBranch,
                  blocker:'missing_FACTORY_BUILDER_USER_TOKEN',
                  production_write:false,deploy:false,execution_authority:'NONE',
                  note:'Copilot issue assignment requires a user token; GitHub Actions GITHUB_TOKEN is intentionally not used for Builder authority.'
                })
              });
              core.setFailed('Missing FACTORY_BUILDER_USER_TOKEN');
              return;
            }
            try{
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees',{
                owner,repo,issue_number:issue.number,
                ...payload,
                headers:{
                  accept:'application/vnd.github+json',
                  authorization:'Bearer '+builderToken,
                  'X-GitHub-Api-Version':'2022-11-28'
                }
              });
            }catch(err){
              const status=err?.status||err?.response?.status||'unknown';
              await github.rest.issues.createComment({
                owner,repo,issue_number:issue.number,
                body:'FACTORY_BUILDER_ASSIGNMENT_V0.1 '+JSON.stringify({
                  version:'0.1',id:r.id,status:'BLOCKED',task_class:r.task_class,
                  builder:d.BUILDER,target_repo:cap.targetRepo,base_branch:cap.baseBranch,
                  blocker:'copilot_assignment_failed_http_'+status,
                  production_write:false,deploy:false,execution_authority:'NONE'
                })
              });
              core.setFailed('Copilot Builder assignment failed HTTP '+status);
              return;
            }

            await github.rest.issues.createComment({
              owner,repo,issue_number:issue.number,
              body:d.ASSIGN_PREFIX+JSON.stringify({
                version:'0.1',id:r.id,status:'ASSIGNED',task_class:r.task_class,
                builder:d.BUILDER,target_repo:cap.targetRepo,base_branch:cap.baseBranch,
                router_run:runId,production_write:false,deploy:false,
                execution_authority:'BRANCH_PR_ONLY',
                next_gate:'Builder opens PR; Chief reviews evidence; Shannon retains deploy authority.'
              })
            });
            core.info('FACTORY_BUILDER_ASSIGNED '+r.id+' -> '+d.BUILDER);
