name: Cybertron Vercel Git disconnect legacy batch v0.1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  disconnect-legacy-projects:
    if: >-
      github.event.issue.title == '[CYBERTRON VERCEL GIT BATCH] isolate legacy projects v0.1' &&
      github.actor == 'VeritasDesign' &&
      github.event.issue.user.login == 'VeritasDesign' &&
      github.event.repository.full_name == 'VeritasDesign/free-frequency-genie-lab'
    runs-on: ubuntu-latest
    environment: Cybertron-vercel-release
    timeout-minutes: 12
    steps:
      - name: Install Vercel CLI
        run: |
          set -euo pipefail
          npm install --global vercel@latest --silent >/dev/null 2>&1
          vercel --version > "$RUNNER_TEMP/vercel-version.txt"

      - name: Preflight all exact legacy projects before any mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          python3 - <<'PY'
          import json, os
          from urllib import parse, request

          team='team_6lvKuv1CthbbshHpQoleqR2R'
          token=os.environ['VERCEL_TOKEN']
          projects=[
              ('the-room-v0-4','prj_iqCAylxvhZgx2YQmPIqjDTCUFWc2','apps/the-room-v0.1','main'),
              ('free_frequency_os_v0','prj_JupSjtsJA4OC1hqJz5KSuZCkFr31','apps/private-hq','main'),
              ('zillions-for-autumn','prj_FA00NatBOjc1ejoQ1X2rsEiqH1gp','apps/zillions-v0.4-shared','zillions-v0.4-shared-2026-09-23'),
              ('shannon-bishop-basket','prj_zq4Ug9nvjkVqNVqILrSnc1EecLbw','apps/landing','main'),
              ('justine-autumn','prj_ZI2dCF2DjCPVI8RTPMZlqrtqvSdj','apps/justine-autumn','main'),
          ]
          rows=[]
          for name,pid,root,prod_branch in projects:
              url='https://api.vercel.com/v9/projects/'+pid+'?'+parse.urlencode({'teamId':team})
              req=request.Request(url,method='GET',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with request.urlopen(req,timeout=20) as r:
                  data=json.load(r)
              assert data.get('id')==pid
              assert data.get('name')==name
              assert data.get('accountId')==team
              assert data.get('rootDirectory')==root
              link=data.get('link')
              assert isinstance(link,dict)
              assert link.get('type')=='github'
              assert link.get('repo')=='free-frequency-factory'
              assert link.get('org')=='VeritasDesign'
              assert link.get('productionBranch')==prod_branch
              rows.append({
                  'name':name,'id':pid,'rootDirectory':root,
                  'prior_link':{
                      'type':link.get('type'),
                      'repo':link.get('repo'),
                      'org':link.get('org'),
                      'productionBranch':link.get('productionBranch'),
                  }
              })
          open(os.environ['RUNNER_TEMP']+'/vercel-git-legacy-preflight.json','w').write(json.dumps(rows,sort_keys=True))
          PY

      - name: Disconnect Git from exact legacy projects only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          export TEAM_SLUG='thebishco-6074s-projects'
          export TEAM_ID='team_6lvKuv1CthbbshHpQoleqR2R'
          for pair in             'the-room-v0-4:prj_iqCAylxvhZgx2YQmPIqjDTCUFWc2'             'free_frequency_os_v0:prj_JupSjtsJA4OC1hqJz5KSuZCkFr31'             'zillions-for-autumn:prj_FA00NatBOjc1ejoQ1X2rsEiqH1gp'             'shannon-bishop-basket:prj_zq4Ug9nvjkVqNVqILrSnc1EecLbw'             'justine-autumn:prj_ZI2dCF2DjCPVI8RTPMZlqrtqvSdj'
          do
            name="${pair%%:*}"
            pid="${pair#*:}"
            dir="$RUNNER_TEMP/vercel-link-${name}"
            mkdir -p "$dir"
            cd "$dir"
            vercel link --yes --project "$pid" --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" >/dev/null
            export EXPECTED_PID="$pid"
            python3 -c "import json,os; d=json.load(open('.vercel/project.json')); assert d.get('projectId')==os.environ['EXPECTED_PID']; assert d.get('orgId')==os.environ['TEAM_ID']"
            vercel git disconnect --yes --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" >/dev/null
          done

      - name: Verify all five links removed and publish receipt file
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from urllib import parse, request

          team='team_6lvKuv1CthbbshHpQoleqR2R'
          token=os.environ['VERCEL_TOKEN']
          prior=json.load(open(os.environ['RUNNER_TEMP']+'/vercel-git-legacy-preflight.json'))
          by_id={row['id']:row for row in prior}
          projects=[
              ('the-room-v0-4','prj_iqCAylxvhZgx2YQmPIqjDTCUFWc2','apps/the-room-v0.1'),
              ('free_frequency_os_v0','prj_JupSjtsJA4OC1hqJz5KSuZCkFr31','apps/private-hq'),
              ('zillions-for-autumn','prj_FA00NatBOjc1ejoQ1X2rsEiqH1gp','apps/zillions-v0.4-shared'),
              ('shannon-bishop-basket','prj_zq4Ug9nvjkVqNVqILrSnc1EecLbw','apps/landing'),
              ('justine-autumn','prj_ZI2dCF2DjCPVI8RTPMZlqrtqvSdj','apps/justine-autumn'),
          ]
          results=[]
          for name,pid,root in projects:
              url='https://api.vercel.com/v9/projects/'+pid+'?'+parse.urlencode({'teamId':team})
              req=request.Request(url,method='GET',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              with request.urlopen(req,timeout=20) as r:
                  data=json.load(r)
              assert data.get('id')==pid
              assert data.get('name')==name
              assert data.get('accountId')==team
              assert data.get('rootDirectory')==root
              assert not isinstance(data.get('link'),dict)
              results.append({
                  'id':pid,'name':name,'rootDirectory':root,
                  'prior_link':by_id[pid]['prior_link'],
                  'current_link':None,
              })
          version=open(os.environ['RUNNER_TEMP']+'/vercel-version.txt').read().strip()
          receipt={
              'status':'COMPLETE',
              'capability':'vercel_git_disconnect_legacy_batch_v0.1',
              'projects':results,
              'vercel_cli_version':version,
              'git_connection_mutations':5,
              'deployments':0,
              'production_alias_changes':0,
              'domain_changes':0,
              'hq_git_connection_changed':False,
          }
          open(os.environ['RUNNER_TEMP']+'/vercel-git-legacy-receipt.json','w').write(json.dumps(receipt,sort_keys=True))
          PY

      - name: Publish sanitized legacy batch receipt
        if: always()
        uses: actions/github-script@v7
        env:
          RECEIPT_PATH: ${{ runner.temp }}/vercel-git-legacy-receipt.json
        with:
          script: |
            const fs=require('fs');
            let receipt;
            try { receipt=JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH,'utf8')); }
            catch { receipt={status:'BLOCKED',capability:'vercel_git_disconnect_legacy_batch_v0.1'}; }
            receipt.workflow_run=context.runId;
            receipt.source_commit=context.sha;
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:context.issue.number,
              body:'CYBERTRON_VERCEL_GIT_DISCONNECT_LEGACY_BATCH_V0.1 '+JSON.stringify(receipt)
            });
