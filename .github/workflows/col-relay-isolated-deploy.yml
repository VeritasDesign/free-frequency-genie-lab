name: Col Relay Isolated Deployment
on:
  pull_request:
    paths:
      - 'lab/col-animal-alphabet-v0/cloudflare-bridge/**'
      - 'lab/col-animal-alphabet-v0/relay-prototype/cloudflare-bridge.test.mjs'
      - 'lab/col-animal-alphabet-v0/relay-prototype/durable-core.mjs'
      - '.github/workflows/col-relay-isolated-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation only; deploy remains blocked pending security/runtime/cost signoff"
        required: true
        type: choice
        options:
          - validate
permissions:
  contents: read
concurrency:
  group: col-animal-relay-isolated
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed target and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'name = "col-animal-relay-isolated"' lab/col-animal-alphabet-v0/cloudflare-bridge/wrangler.toml
          node --check lab/col-animal-alphabet-v0/cloudflare-bridge/worker.mjs
          node --test lab/col-animal-alphabet-v0/relay-prototype/cloudflare-bridge.test.mjs
      - name: Bundle with actual Cloudflare Wrangler (no deployment)
        run: npx --yes wrangler@4.45.0 deploy --dry-run --outdir /tmp/col-relay-bundle
        working-directory: lab/col-animal-alphabet-v0/cloudflare-bridge
      - name: Check credential presence (manual runs only; no secret disclosure)
        if: github.event_name == 'workflow_dispatch'
        env:
          COL_TOKEN: ${{ secrets.COL_RELAY_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$COL_TOKEN" ]; then
            echo "::error::COL_RELAY_CLOUDFLARE_API_TOKEN unavailable"
            exit 1
          fi
          echo 'Deployment credential available (value hidden)'
      - name: Deployment gate
        run: |
          echo "Validation only. No deployment until security, cost, and runtime blockers are resolved."
