name: Col Animal Relay Prototype Tests
on:
  pull_request:
    paths:
      - 'lab/col-animal-alphabet-v0/relay-prototype/**'
      - '.github/workflows/col-animal-relay-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lab/col-animal-alphabet-v0/relay-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check server.test.mjs
      - name: Protocol tests
        run: npm test
