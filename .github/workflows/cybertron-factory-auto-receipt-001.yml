name: Cybertron Factory automatic repair receipt 001

on:
  workflow_run:
    workflows:
      - Cybertron isolated AI repair canary 005
    types: [completed]

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: cybertron-receipt-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  readback:
    if: github.event.workflow_run.repository.full_name == 'VeritasDesign/free-frequency-genie-lab' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact run, validate receipt, and preserve result in issue 151
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          repo = "VeritasDesign/free-frequency-genie-lab"
          api = "https://api.github.com/repos/" + repo
          run_id = int(os.environ["RUN_ID"])
          token = os.environ["GH_TOKEN"]
          def request(url, method="GET", payload=None, accept="application/vnd.github+json"):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": accept, "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read()
          try:
              jobs = json.loads(request(api + "/actions/runs/" + str(run_id) + "/jobs?per_page=100"))["jobs"]
              target = [j for j in jobs if j.get("name") == "isolated-repair"]
              if len(target) != 1:
                  raise ValueError("Expected exactly one isolated-repair job")
              job = target[0]
              logs = request(api + "/actions/jobs/" + str(job["id"]) + "/logs").decode("utf-8", "replace")
              def marked(name):
                  # GitHub logs may include timestamps and ANSI codes.
                  return bool(re.search(r"(?m)^.*\\b" + re.escape(name) + r":\\s*True\\s*$", logs))
              passed = ("AI_REPAIR_005_PASS" in logs and
                        marked("BASELINE_FAIL") and
                        marked("GUARDRAIL_ACCEPTED") and
                        marked("INDEPENDENT_TESTS_PASS") and
                        marked("SOURCE_CHANGED") and
                        os.environ["RUN_CONCLUSION"] == "success" and
                        job.get("conclusion") == "success" and
                        os.environ["RUN_ACTOR"] == "VeritasDesign")
              status = "VERIFIED BOUNDED REPAIR PASS" if passed else "NOT PROVEN / FAILED"
              lines = [
                  "## Cybertron automatic readback — canary 005",
                  "",
                  "**" + status + "**",
                  "",
                  "- Run: " + os.environ["RUN_HTML_URL"],
                  "- Run ID: `" + str(run_id) + "`",
                  "- Commit: `" + os.environ["RUN_HEAD_SHA"] + "`",
                  "- Actor: `" + os.environ["RUN_ACTOR"] + "`",
                  "- Workflow conclusion: `" + os.environ["RUN_CONCLUSION"] + "`",
                  "- Isolated job conclusion: `" + str(job.get("conclusion")) + "`",
                  "- Baseline failed: `" + str(marked("BASELINE_FAIL")) + "`",
                  "- Guardrail accepted: `" + str(marked("GUARDRAIL_ACCEPTED")) + "`",
                  "- Source changed: `" + str(marked("SOURCE_CHANGED")) + "`",
                  "- Independent tests passed: `" + str(marked("INDEPENDENT_TESTS_PASS")) + "`",
                  "- Exact PASS marker: `" + str("AI_REPAIR_005_PASS" in logs) + "`",
                  "- Hugging Face cost: **UNKNOWN** (consult provider billing)",
                  "",
                  "Evidence is bounded to this single temporary repair. No repository repair commit, deployment, or autonomous draft PR is implied.",
                  "",
                  "_Automatically generated by a read-only log inspection job; no inference call was made by this readback._"
              ]
              body = "\n".join(lines)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(body + "\n")
              request(api + "/issues/151/comments", method="POST", payload={"body": body})
              print("READBACK_POSTED_TO_ISSUE_151:", status)
          except (urllib.error.HTTPError, urllib.error.URLError, ValueError, KeyError) as exc:
              print("READBACK_BLOCKED:", type(exc).__name__, file=sys.stderr)
              sys.exit(1)
          PY
