name: Cybertron AIR-ROCK-001 Scheduled Worker v0.1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cybertron-air-rock-001-worker-v01.yml'
      - '.github/scripts/cybertron-air-rock-001-worker-v01.cjs'
      - '.github/scripts/test-cybertron-air-rock-001-worker-v01.cjs'
      - '.github/scripts/test-factory-parts-reconnection-v01.cjs'
      - '.github/scripts/test-rock-factory-handoff-v01.cjs'
      - '.github/workflows/cybertron-airtable-ready-dispatcher-v02.yml'
      - '.github/scripts/cybertron-airtable-ready-dispatcher-v02.cjs'
      - '.github/scripts/test-cybertron-airtable-ready-dispatcher-v02.cjs'
      - '.github/scripts/test-cybertron-ready-dispatch-decision-v01.cjs'
      - '.github/scripts/air-real-002-terminal-proof-v01.cjs'
      - '.github/scripts/test-air-real-002-terminal-proof-v01.cjs'
      - '.github/scripts/test-air-real-002-workflow-gates-v01.cjs'
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: cybertron-air-rock-001-single-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  harmless-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded worker contract
        run: node .github/scripts/test-cybertron-air-rock-001-worker-v01.cjs
      - name: Verify isolated Factory Parts reconnection fixture
        run: node .github/scripts/test-factory-parts-reconnection-v01.cjs
      - name: Qualify fail-closed ROCK to Factory handoff contract
        run: node .github/scripts/test-rock-factory-handoff-v01.cjs
      - name: Qualify AIR-REAL-002 terminal and dispatcher contracts offline
        run: |
          node .github/scripts/test-cybertron-airtable-ready-dispatcher-v02.cjs
          node .github/scripts/test-cybertron-ready-dispatch-decision-v01.cjs
          node .github/scripts/test-air-real-002-terminal-proof-v01.cjs
          node .github/scripts/test-air-real-002-workflow-gates-v01.cjs
      - name: Execute only on scheduled or explicitly dispatched default-branch runs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node .github/scripts/cybertron-air-rock-001-worker-v01.cjs
